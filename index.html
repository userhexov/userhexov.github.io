<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>hexov · portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;600&family=Oxanium:wght@600;700&family=Share+Tech+Mono&family=Chakra+Petch:wght@600&family=Audiowide&family=Syncopate:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080810;--bg2:#0d0d1a;
  --ember:#ff6b35;--ember-dim:rgba(255,107,53,.15);--ember-glow:rgba(255,107,53,.35);
  --purple:#7c3aed;--purple-dim:rgba(124,58,237,.15);
  --text:#e8e4ff;--text-dim:rgba(232,228,255,.45);--text-mid:rgba(232,228,255,.7);
  --glass:rgba(255,255,255,.03);--glass-b:rgba(255,255,255,.07);
  --mono:'JetBrains Mono',monospace;--display:'Syne',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--display);overflow-x:hidden;cursor:none;}

/* CURSOR */
#cur{position:fixed;z-index:9999;pointer-events:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ember);transform:translate(-50%,-50%);mix-blend-mode:exclusion;transition:width .2s,height .2s,border-color .2s;}
#cur-dot{position:fixed;z-index:9999;pointer-events:none;width:5px;height:5px;background:var(--ember);border-radius:50%;transform:translate(-50%,-50%);}
body.hovering #cur{width:56px;height:56px;border-color:#fff;}

/* NOISE */
body::before{content:'';position:fixed;inset:0;z-index:998;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.3rem 4rem;backdrop-filter:blur(24px);background:rgba(8,8,16,.75);border-bottom:1px solid rgba(255,255,255,.05);animation:slideNavDown .7s ease forwards;}

/* NAV LOGO GLITCH */
.nav-logo{text-decoration:none;display:inline-flex;align-items:baseline;gap:0;line-height:1;}
.logo-glitch{
  font-family:'Syncopate',sans-serif;
  font-weight:700;
  font-size:1.05rem;
  letter-spacing:.18em;
  display:inline-block;
  color:var(--ember);
  transform:scaleY(.72);
  transform-origin:bottom;
  position:relative;
}
.logo-glitch::before,.logo-glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;overflow:hidden;font-family:'Syncopate',sans-serif;font-weight:700;}
.logo-glitch::before{color:cyan;clip-path:polygon(0 0,100% 0,100% 38%,0 38%);animation:nglitch1 4s infinite;}
.logo-glitch::after{color:magenta;clip-path:polygon(0 62%,100% 62%,100% 100%,0 100%);animation:nglitch2 4s infinite;}
.logo-dot{font-family:'Syncopate',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.1em;color:rgba(232,228,255,.35);transform:scaleY(.72);transform-origin:bottom;display:inline-block;}
@keyframes nglitch1{0%,88%,100%{transform:translateX(0);opacity:0}89%{transform:translateX(-2px);opacity:.8}91%{transform:translateX(2px);opacity:.8}93%{transform:translateX(0);opacity:0}}
@keyframes nglitch2{0%,88%,100%{transform:translateX(0);opacity:0}90%{transform:translateX(2px);opacity:.7}92%{transform:translateX(-1px);opacity:.7}94%{transform:translateX(0);opacity:0}}

.nav-right{display:flex;align-items:center;gap:2rem;}
.nav-links{display:flex;gap:2rem;}
.nav-links a{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;color:var(--text-dim);text-decoration:none;transition:color .2s;position:relative;}
.nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:1px;background:var(--ember);transform:scaleX(0);transform-origin:left;transition:transform .25s;}
.nav-links a:hover{color:var(--ember);}
.nav-links a:hover::after{transform:scaleX(1);}

/* LANG SWITCHER */
.lang-sw{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:.3rem;overflow:hidden;}
.lang-sw button{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;background:transparent;border:none;color:var(--text-dim);padding:.4rem .75rem;cursor:pointer;transition:background .2s,color .2s;}
.lang-sw button.active{background:var(--ember);color:#0a0a0f;font-weight:600;}
.lang-sw button:not(.active):hover{color:var(--ember);}

@keyframes slideNavDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;padding:6rem 4rem 4rem;position:relative;overflow:hidden;}
.hero-grid-bg{position:absolute;inset:0;z-index:0;background-image:linear-gradient(rgba(255,107,53,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,107,53,.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 0%,transparent 100%);}
.hero-orb{position:absolute;z-index:0;border-radius:50%;filter:blur(80px);pointer-events:none;}
.hero-orb-1{width:600px;height:600px;background:rgba(255,107,53,.08);top:-200px;right:-100px;}
.hero-orb-2{width:400px;height:400px;background:rgba(124,58,237,.1);bottom:-100px;left:100px;}
.hero-content{position:relative;z-index:1;max-width:900px;}

.hero-tag{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--ember);background:var(--ember-dim);border:1px solid rgba(255,107,53,.25);padding:.4rem 1rem;border-radius:2rem;margin-bottom:2.5rem;animation:fadeUp .7s .2s ease both;}
.hero-tag::before{content:'';width:6px;height:6px;background:var(--ember);border-radius:50%;animation:blink 1.5s infinite;}

.hero-name{font-size:clamp(4rem,10vw,8.5rem);font-weight:800;line-height:.95;letter-spacing:-.04em;animation:fadeUp .7s .35s ease both;margin-bottom:1.5rem;}
.hero-name .line1{display:block;color:var(--text);position:relative;}
.hero-name .line2{display:block;background:linear-gradient(100deg,var(--ember) 0%,#ff9a6c 40%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 40px rgba(255,107,53,.4));}

.glitch-wrap{position:relative;display:inline-block;}
.glitch-wrap::before,.glitch-wrap::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;overflow:hidden;color:var(--text);}
.glitch-wrap::before{clip-path:polygon(0 0,100% 0,100% 38%,0 38%);animation:hglitch1 4s infinite;color:rgba(0,255,200,.7);}
.glitch-wrap::after{clip-path:polygon(0 62%,100% 62%,100% 100%,0 100%);animation:hglitch2 4s infinite;color:rgba(180,0,255,.6);}
@keyframes hglitch1{0%,85%,100%{transform:translateX(0);opacity:0}86%{transform:translateX(-4px);opacity:.8}88%{transform:translateX(3px);opacity:.8}90%{transform:translateX(0);opacity:0}}
@keyframes hglitch2{0%,85%,100%{transform:translateX(0);opacity:0}87%{transform:translateX(4px);opacity:.7}89%{transform:translateX(-2px);opacity:.7}91%{transform:translateX(0);opacity:0}}

.hero-desc{font-family:var(--mono);font-size:1rem;font-weight:300;color:var(--text-mid);line-height:1.9;max-width:500px;animation:fadeUp .7s .5s ease both;margin-bottom:3rem;}
.hero-desc .hl{color:var(--ember);}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;animation:fadeUp .7s .65s ease both;}

.btn-primary{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.78rem;letter-spacing:.15em;background:var(--ember);color:#0a0a0f;padding:.85rem 2rem;border-radius:.4rem;text-decoration:none;font-weight:600;box-shadow:0 0 40px var(--ember-glow);transition:transform .2s,box-shadow .2s;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 60px var(--ember-glow);}
.btn-ghost{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.78rem;letter-spacing:.15em;background:transparent;color:var(--text-mid);padding:.85rem 2rem;border-radius:.4rem;text-decoration:none;border:1px solid rgba(255,255,255,.12);transition:border-color .2s,color .2s,transform .2s;}
.btn-ghost:hover{border-color:var(--ember);color:var(--ember);transform:translateY(-2px);}

.hero-scroll{position:absolute;bottom:2.5rem;left:4rem;display:flex;align-items:center;gap:.8rem;font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;color:var(--text-dim);animation:fadeUp .7s .9s ease both;}
.scroll-line{width:40px;height:1px;background:linear-gradient(90deg,var(--ember),transparent);}

/* SECTIONS */
section{padding:7rem 4rem;position:relative;}
.s-label{font-family:var(--mono);font-size:.68rem;letter-spacing:.3em;color:var(--ember);margin-bottom:1rem;opacity:.8;}
.s-title{font-size:clamp(2rem,4vw,3.2rem);font-weight:800;letter-spacing:-.03em;color:var(--text);margin-bottom:.5rem;line-height:1.1;}
.s-rule{width:50px;height:2px;background:var(--ember);margin:1.5rem 0 4rem;border-radius:2px;}

/* STACK */
.stack-section{background:var(--bg2);}
.stack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;max-width:900px;}
.stack-item{background:var(--glass);border:1px solid var(--glass-b);border-radius:.8rem;padding:1.6rem 1.4rem;display:flex;flex-direction:column;align-items:flex-start;gap:.7rem;transition:transform .25s,border-color .25s,background .25s,opacity .5s;position:relative;overflow:hidden;opacity:0;transform:translateY(20px);}
.stack-item::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,var(--ember-dim) 0%,transparent 70%);opacity:0;transition:opacity .3s;}
.stack-item:hover{transform:translateY(-5px);border-color:rgba(255,107,53,.3);background:rgba(255,107,53,.05);}
.stack-item:hover::after{opacity:1;}
.stack-item.learning{border-color:rgba(124,58,237,.25);}
.stack-item.learning::after{background:radial-gradient(circle at 50% 120%,rgba(124,58,237,.15) 0%,transparent 70%);}
.stack-item.learning:hover{border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.06);}

.stack-name{font-size:1.05rem;font-weight:600;color:var(--text);}
.stack-name.py{font-family:'Oxanium',sans-serif;font-size:1.05rem;}
.stack-name.sh{font-family:'Share Tech Mono',monospace;font-size:1rem;}
.stack-name.sq{font-family:'Chakra Petch',sans-serif;font-size:.95rem;}
.stack-name.rs{font-family:'Audiowide',sans-serif;font-size:.88rem;letter-spacing:.05em;}

.stack-tag{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;padding:.2rem .6rem;border-radius:2rem;background:var(--ember-dim);color:var(--ember);}
.stack-item.learning .stack-tag{background:var(--purple-dim);color:#a78bfa;}
.stack-bar{width:100%;height:2px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;}
.stack-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ember),#ff9a6c);width:0%;transition:width 1s .3s ease;}
.stack-item.learning .stack-bar-fill{background:linear-gradient(90deg,var(--purple),#a78bfa);}

/* PROJECTS */
.project-card{max-width:900px;background:var(--glass);border:1px solid var(--glass-b);border-radius:1.2rem;overflow:hidden;transition:border-color .3s,box-shadow .3s;}
.project-card:hover{border-color:rgba(255,107,53,.3);box-shadow:0 20px 60px rgba(255,107,53,.07);}
.project-header{padding:2.5rem 2.5rem 0;display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap;}
.project-status{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.65rem;letter-spacing:.15em;color:#fbbf24;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);padding:.3rem .8rem;border-radius:2rem;}
.project-status::before{content:'';width:5px;height:5px;background:#fbbf24;border-radius:50%;animation:blink 2s infinite;}
.project-title{font-size:2rem;font-weight:800;letter-spacing:-.03em;color:var(--text);margin-top:.8rem;}
.project-title span{background:linear-gradient(90deg,var(--ember),#ff9a6c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.project-body{padding:1.5rem 2.5rem;}
.project-desc{font-family:var(--mono);font-size:.9rem;line-height:1.9;color:var(--text-mid);max-width:600px;margin-bottom:2rem;}

.project-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem;margin-bottom:2rem;}
.feat{display:flex;align-items:center;gap:.8rem;font-family:var(--mono);font-size:.78rem;color:var(--text-mid);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:.7rem 1rem;border-radius:.6rem;transition:border-color .2s,color .2s;}
.feat:hover{border-color:rgba(255,107,53,.2);color:var(--text);}
.feat-sym{color:var(--ember);font-weight:700;min-width:1.5rem;font-size:.8rem;}

.project-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem;}
.tag{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;padding:.3rem .8rem;border-radius:2rem;border:1px solid rgba(255,255,255,.1);color:var(--text-dim);cursor:default;transition:border-color .2s,color .2s;}
.tag:hover{border-color:rgba(255,107,53,.3);color:var(--ember);}

/* TERMINAL */
.terminal{margin:0 2.5rem 2.5rem;background:#050508;border:1px solid rgba(255,255,255,.08);border-radius:.8rem;overflow:hidden;font-family:var(--mono);font-size:.82rem;}
.term-bar{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);}
.term-dot{width:10px;height:10px;border-radius:50%;}
.term-dot.r{background:#ff5f57;}.term-dot.y{background:#febc2e;}.term-dot.g{background:#28c840;}
.term-title{font-size:.65rem;color:var(--text-dim);letter-spacing:.1em;margin-left:.5rem;}
.term-body{padding:1.2rem 1.4rem;line-height:2.1;color:rgba(232,228,255,.6);}
.term-line .p{color:var(--ember);}.term-line .c{color:#a78bfa;}.term-line .s{color:#34d399;}.term-line .dim{color:rgba(232,228,255,.3);}
.term-cursor{display:inline-block;width:8px;height:1em;background:var(--ember);vertical-align:middle;margin-left:2px;animation:blink .9s infinite;}

/* ABOUT */
.about-layout{display:grid;grid-template-columns:1fr 1fr;gap:4rem;max-width:900px;align-items:start;}
.about-text p{font-family:var(--mono);font-size:.9rem;line-height:2;color:var(--text-mid);margin-bottom:1rem;}
.about-text p .hl{color:var(--ember);}
.about-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:1rem;padding:2rem;position:relative;overflow:hidden;}
.about-card::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,53,.08) 0%,transparent 70%);}
.about-stat{margin-bottom:1.5rem;}
.about-stat:last-child{margin-bottom:0;}
.stat-val{font-size:2.2rem;font-weight:800;color:var(--ember);letter-spacing:-.03em;line-height:1;}
.stat-label{font-family:var(--mono);font-size:.72rem;color:var(--text-dim);letter-spacing:.1em;margin-top:.3rem;}

/* CONTACT */
.contact-section{background:var(--bg2);text-align:center;}
.contact-section .s-label,.contact-section .s-title{text-align:center;}
.contact-section .s-rule{margin-left:auto;margin-right:auto;}
.contact-card{display:inline-flex;align-items:center;gap:1.2rem;background:var(--glass);border:1px solid var(--glass-b);border-radius:1rem;padding:2rem 3rem;text-decoration:none;transition:border-color .3s,transform .3s,box-shadow .3s;position:relative;overflow:hidden;}
.contact-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--ember-dim),transparent 60%);opacity:0;transition:opacity .3s;}
.contact-card:hover{border-color:rgba(255,107,53,.4);transform:translateY(-4px);box-shadow:0 20px 50px rgba(255,107,53,.1);}
.contact-card:hover::before{opacity:1;}
.tg-icon-wrap{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2aabee,#229ed9);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 24px rgba(42,171,238,.35);transition:box-shadow .3s,transform .3s;}
.contact-card:hover .tg-icon-wrap{box-shadow:0 0 40px rgba(42,171,238,.55);transform:scale(1.08);}
.tg-icon-wrap svg{width:28px;height:28px;fill:#fff;}
.contact-info{text-align:left;}
.contact-info .label{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;color:var(--text-dim);}
.contact-info .handle{font-size:1.4rem;font-weight:700;color:var(--text);letter-spacing:-.02em;margin-top:.2rem;}

/* FOOTER */
footer{padding:2rem 4rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;border-top:1px solid rgba(255,255,255,.05);font-family:var(--mono);font-size:.7rem;color:var(--text-dim);letter-spacing:.1em;}
footer .ember{color:var(--ember);}

/* ── LOADER ── */
#loader{position:fixed;inset:0;z-index:9500;pointer-events:all;}
.loader-half{
  position:absolute;left:0;right:0;height:50%;
  background:var(--bg);
  transition:transform .7s cubic-bezier(.77,0,.175,1);
}
.loader-half.top{top:0;}
.loader-half.bot{bottom:0;}
#loader.split .loader-half.top{transform:translateY(-100%);}
#loader.split .loader-half.bot{transform:translateY(100%);}
#loader.split{pointer-events:none;}

.loader-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2rem;z-index:1;
}
.loader-name{
  font-family:'Syncopate',sans-serif;
  font-weight:700;
  font-size:clamp(2.5rem,8vw,5.5rem);
  letter-spacing:.22em;
  color:var(--ember);
  transform:scaleY(.7);
  transform-origin:center;
  display:inline-block;
  filter:drop-shadow(0 0 30px rgba(255,107,53,.5));
  position:relative;
}
.loader-name .ld-dot{
  font-family:'Syncopate',sans-serif;
  font-size:.55em;
  color:rgba(232,228,255,.3);
  letter-spacing:.1em;
}
/* scanline on loader */
.loader-center::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px);
  z-index:2;
}
.loader-pct{
  font-family:var(--mono);
  font-size:clamp(4rem,12vw,8rem);
  font-weight:600;
  color:var(--text);
  letter-spacing:-.04em;
  line-height:1;
  position:relative;
}
.loader-pct .pct-sym{
  font-size:.45em;
  color:var(--ember);
  vertical-align:super;
  letter-spacing:0;
}
.loader-bar-wrap{
  width:220px;height:1px;
  background:rgba(255,255,255,.08);
  position:relative;overflow:visible;
}
.loader-bar-fill{
  height:1px;width:0%;
  background:var(--ember);
  position:relative;
  transition:none;
}
.loader-bar-fill::after{
  content:'';position:absolute;right:-1px;top:-2px;
  width:2px;height:5px;
  background:var(--ember);
  box-shadow:0 0 8px var(--ember-glow);
}
.loader-status{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.25em;
  color:var(--text-dim);height:.8rem;
}

/* page reveal */
.page-wrap>*{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease;}
.page-wrap.revealed>*{opacity:1;transform:translateY(0);}


/* PARTICLES */
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.6;}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.reveal{opacity:0;transform:translateY(32px);transition:opacity .7s ease,transform .7s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}
.type-cursor{display:inline-block;width:2px;height:1em;background:var(--ember);vertical-align:middle;margin-left:2px;animation:blink .9s infinite;}

@media(max-width:768px){
  nav{padding:1rem 1.5rem;}
  .hero{padding:6rem 1.5rem 4rem;}
  section{padding:5rem 1.5rem;}
  footer{padding:1.5rem;}
  .about-layout{grid-template-columns:1fr;}
  .project-header,.project-body{padding-left:1.5rem;padding-right:1.5rem;}
  .terminal{margin:0 1.5rem 1.5rem;}
  .nav-links{display:none;}
  .hero-scroll{display:none;}
}
</style>
</head>
<body>

<canvas id="particles-canvas"></canvas>
<div id="cur"></div>
<div id="cur-dot"></div>

<!-- LOAD
